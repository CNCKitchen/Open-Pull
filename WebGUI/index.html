<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Pull Control</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Open Pull</h1>
        <span>Tensile Tester Console</span>
      </div>
      <div class="top-actions">
        <button id="emergencyStopBtn" class="btn danger">EMERGENCY STOP</button>
        <button id="connectBtn" class="btn">Connect</button>
        <span id="connectionState" class="badge">Disconnected</span>
      </div>
    </header>

    <main class="layout">
      <section class="left-panel">
        <label class="section-label">Current Load</label>
        <div class="big-metric" id="currentLoad">0 N</div>

        <label class="section-label">Max Load</label>
        <div class="small-metric" id="maxLoad">0 N</div>

        <label class="section-label">Sample Type</label>
        <select id="testType" class="input full">
          <option value="rectangular">Rectangular Sample</option>
          <option value="cylindrical">Cylindical Sample</option>
          <option value="load">Load Test</option>
        </select>

        <div class="inline-input short-input">
          <select id="speedInput" class="input">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="50">50</option>
          </select>
          <span><em>mm/min</em> <strong>Speed</strong></span>
        </div>

        <div class="inline-input short-input">
          <input id="widthInput" class="input" type="number" step="0.01" value="10.00" />
          <span><em>mm</em> <strong>Width</strong></span>
        </div>

        <div class="inline-input short-input">
          <input id="heightInput" class="input" type="number" step="0.01" value="2.00" />
          <span><em>mm</em> <strong>Thickness</strong></span>
        </div>

        <div class="inline-input short-input" id="diameterRow">
          <input id="diameterInput" class="input" type="number" step="0.01" value="5.00" />
          <span><em>mm</em> <strong>Diameter</strong></span>
        </div>

        <input id="sampleName" class="input full" placeholder="Sample Name" />
        <input id="sampleComment" class="input full" placeholder="Comment" />

        <button id="newTestBtn" class="btn full">New Test</button>
        <button id="startTestBtn" class="btn full strong">START TEST</button>
        <button id="manualStopBtn" class="btn full">Manual Stop</button>
        <button id="tareBtn" class="btn full">Tare</button>

        <div class="split">
          <button id="setZeroBtn" class="btn">Set ZERO</button>
          <button id="gotoZeroBtn" class="btn">Goto ZERO</button>
        </div>

        <button id="exportBtn" class="btn full">Export</button>

        <details class="config-section">
          <summary>Configuration</summary>
          <div class="inline-input">
            <input id="preloadInput" class="input" type="number" step="0.1" value="2.0" />
            <button id="setPreloadBtn" class="btn mini">Set Preload N</button>
          </div>
          <div class="inline-input">
            <input id="alphaInput" class="input" type="number" step="0.01" min="0.01" max="1.00" value="0.20" />
            <button id="setAlphaBtn" class="btn mini">Set Filter Alpha</button>
          </div>
          <div class="inline-input">
            <input id="sampleRateInput" class="input" type="number" step="1" value="80" />
            <button id="setSampleRateBtn" class="btn mini">Set Sample Hz</button>
          </div>
          <div class="inline-input">
            <input id="manualSlowInput" class="input" type="number" step="0.1" value="7.3" />
            <button id="setManualSlowBtn" class="btn mini">Set Manual Slow</button>
          </div>
          <div class="inline-input">
            <input id="manualFastInput" class="input" type="number" step="0.1" value="72.8" />
            <button id="setManualFastBtn" class="btn mini">Set Manual Fast</button>
          </div>
          <div class="inline-input">
            <input id="accelInput" class="input" type="number" step="0.1" value="30.0" />
            <button id="setAccelBtn" class="btn mini">Set Accel</button>
          </div>
          <div class="inline-input">
            <input id="gainInput" class="input" type="number" step="0.1" placeholder="-875.7" />
            <button id="setGainBtn" class="btn mini">Set Gain</button>
          </div>
        </details>
      </section>

      <section class="main-panel">
        <div class="metrics-grid">
          <div class="metric-card">
            <label class="section-label">Current Displacement</label>
            <div class="big-metric" id="currentDisp">0.00 mm</div>
          </div>
          <div class="metric-card" id="stressCard">
            <label class="section-label">Current Stress</label>
            <div class="big-metric" id="currentStress">0.0 MPa</div>
            <label class="section-label">Max Stress</label>
            <div class="small-metric" id="maxStress">0.0 MPa</div>
          </div>
        </div>

        <div class="chart-wrap">
          <div class="chart-canvas-wrap">
            <canvas id="chartCanvas" width="760" height="440"></canvas>
          </div>
          <div class="jog-panel" aria-label="Manual relative movement">
            <button id="jogPlus10Btn" class="btn mini">+10 mm</button>
            <button id="jogPlus1Btn" class="btn mini">+1 mm</button>
            <button id="jogPlus01Btn" class="btn mini">+0.1 mm</button>
            <button id="jogMinus01Btn" class="btn mini">-0.1 mm</button>
            <button id="jogMinus1Btn" class="btn mini">-1 mm</button>
            <button id="jogMinus10Btn" class="btn mini">-10 mm</button>
          </div>
        </div>

        <div class="status-line" id="statusLine">STATUS: ready</div>
        <div class="serial-monitor" id="serialMonitor"></div>
      </section>
    </main>

    <section class="series-panel" id="seriesPanel">
      <div class="series-head">
        <label class="section-label">Performed Tests In Series</label>
        <span class="series-id" id="seriesIdLabel">No active series</span>
      </div>
      <button id="newSeriesBtn" class="btn full new-series-in-list">New Series</button>
      <div id="seriesEmpty" class="series-empty">No tests recorded yet.</div>
      <div id="seriesList" class="series-list"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
